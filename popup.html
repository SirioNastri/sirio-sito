<!-- ============================
     POPUP RICHIEDI PREVENTIVO
============================ -->
<div id="popup-overlay"></div>

<div id="popup-preventivo">
    <span class="popup-close" onclick="chiudiPopup()">×</span>

    <div class="popup-grid">

        <div class="popup-info">
            <h2 class="popup-title">Richiedi un preventivo</h2>
            <p>Compila i dati per richiedere una consulenza gratuita con un nostro tecnico.</p>

            <h3>Contatti</h3>
            <p><strong>Telefono:</strong><br>(+39) 0363 96.86.99</p>
            <p><strong>Email:</strong><br>info@sirionastri.it</p>
        </div>

        <form class="popup-form">
            <input type="text" class="popup-input" placeholder="Azienda">
            <input type="text" class="popup-input" placeholder="Nome *" required>
            <input type="text" class="popup-input" placeholder="Cognome *" required>
            <input type="email" class="popup-input" placeholder="Email *" required>
            <input type="text" class="popup-input" placeholder="Telefono">
            <textarea class="popup-input" placeholder="Messaggio" rows="4"></textarea>

            <button type="submit" class="popup-btn">Invia richiesta</button>
        </form>

    </div>
</div>

<script>
function apriPopup() {
    document.getElementById("popup-preventivo").classList.add("active");
    document.getElementById("popup-overlay").classList.add("active");
}

function chiudiPopup() {
    document.getElementById("popup-preventivo").classList.remove("active");
    document.getElementById("popup-overlay").classList.remove("active");
}
</script>
